# MediaMotion 개발 컨테이너. 빌드 컨텍스트 = 레포 루트.
#   전체 빌드: docker compose -f docker/docker-compose.yml build
#   전체 기동: docker compose -f docker/docker-compose.yml up -d
#   셸:     docker compose -f docker/docker-compose.yml exec gvhmr bash
#   정지:     docker compose -f docker/docker-compose.yml down
services:
  gvhmr:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gvhmr
    image: mediamotion/gvhmr:cu128
    container_name: mediamotion-gvhmr
    tty: true
    stdin_open: true
    volumes:
      - ../GVHMR-main:/app/GVHMR         # 소스 + 대용량 체크포인트는 호스트에 유지
      - ../scripts:/app/scripts          # 파이프라인 스크립트
      - ../data:/data                    # 공유 작업 워크스페이스 (백엔드/blender도 사용)
    working_dir: /app/GVHMR
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  smplestx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.smplestx
    image: mediamotion/smplestx:cu128
    container_name: mediamotion-smplestx
    tty: true
    stdin_open: true
    volumes:
      - ../SMPLest-X:/app/SMPLest-X
      - ../scripts:/app/scripts
      - ../data:/data
      # 바디 모델 (SMPLX_*.npz)을 이미 다운로드한 것에서 공유:
      - ../models:/app/SMPLest-X/human_models/human_model_files:ro
      # GVHMR의 YOLO 가중치 재사용:
      - ../GVHMR-main/inputs/checkpoints/yolo/yolov8x.pt:/app/SMPLest-X/pretrained_models/yolov8x.pt:ro
    working_dir: /app/SMPLest-X
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  blender:
    build:
      context: ..
      dockerfile: docker/Dockerfile.blender
    image: mediamotion/blender:4.2
    container_name: mediamotion-blender
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]       # `exec`이 동작하도록 계속 실행 상태 유지
    volumes:
      - ../scripts:/work/scripts
      - ../GVHMR-main/outputs:/work/outputs
      - ../data:/data
    working_dir: /work

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: mediamotion/backend:latest
    container_name: mediamotion-backend
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8010:8000"
    volumes:
      - ../data:/data
      - ../backend:/srv                  # 개발 중 핵 리로드 친화적
      # 호스트 데몬을 통해 워커 컨테이너를 구동한다:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gvhmr
      - blender

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: mediamotion/frontend:latest
    container_name: mediamotion-frontend
    ports:
      - "5000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8010
      # Windows 바인드 마운트는 inotify 이벤트를 발생시키지 않는다. 폴링을 활성화하여 next dev 핵 리로드를 작동시킨다.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../frontend:/app          # 소스 편집 핵 리로드
      - /app/node_modules         # 이미지의 설치된 의존성 유지
    depends_on:
      - backend
